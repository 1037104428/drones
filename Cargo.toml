[package]
name = "battlefield-sim"
version = "0.1.0"
edition = "2021"
description = "Circular battlefield sweep simulator for FPV targeting algorithms"
publish = false
rust-version = "1.74"

[dependencies]
arrayvec = "0.7"
clap = { version = "4", features = ["derive"] }
rand = { version = "=0.8.5", features = ["std", "std_rng"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = "1.10"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
